# The dsh-tui bundle patch: interactive terminal mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the optional initial-task
# positional (`dsh --profile tui ["task"]`) and this app's --help, then the
# terminal driver creates an Agent through the core registry and relays
# between stdin and the session event stream until the user exits.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # The preset roster: shipped presets (standard / code / minimal / cordis)
    # resolve beside apps/cli's config; user presets live at
    # $DSH_HOME/.agent-presets. Mirrors the Web bundle's row.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # The Cordis host runner: provides dynamicCordisRunner + cordisInspect,
    # which the 'cordis' (创造模式) preset's tool-cordis requires. Web mounts it;
    # without it here the creative preset fails to mount (tool waits on the
    # service). Same trust boundary as Web: the preset's model may mutate the
    # live runtime.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: tui-startup
      name: '@deepseek-ai/dsh-tui/startup'

    # Reads its optional initial task and preset from the tuiStartup provider.
    - id: tui-runner
      name: '@deepseek-ai/dsh-tui'
      inject: [tuiStartup]
      config:
        task: !!js ctx.tuiStartup.task
        preset: !!js ctx.tuiStartup.preset
        resume: !!js ctx.tuiStartup.resume
